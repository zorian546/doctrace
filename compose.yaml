# Runs DocTrace as two containers: `api` holds the models and the HTTP service, `ui` is the
# dashboard and calls the API over the compose network, so the models are loaded once.
#
# Qdrant is not a service here: the project talks to a hosted Qdrant Cloud cluster (free
# tier), with the reasoning in ENGINEERING_NOTES.md. Put QDRANT_URL and QDRANT_API_KEY in
# a .env file in the project root (copy .env.example). Set DOCTRACE_API_KEY there as well
# if the ports are reachable by anyone other than you.
#
# Both published ports are bound to 127.0.0.1. Change that on purpose, not by accident.

services:
  api:
    build: .
    command: ["python", "-m", "doctrace.service.server"]
    environment:
      DOCTRACE_HOST: "0.0.0.0"   # listen on all interfaces inside the container only
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./data/processed:/srv/doctrace/data/processed:ro
      # Keeps downloaded model weights (Qwen2.5-3B, BGE-M3, cross-encoder) across container
      # restarts. Without it each new container pulls several GB from the HF Hub on its
      # first query (about 35 minutes cold, see ENGINEERING_NOTES.md).
      # `docker compose stop` / `start` keeps the volume; `docker compose down -v` deletes it.
      - hf_cache:/home/doctrace/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/status', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 60s
      retries: 3
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  ui:
    build: .
    environment:
      DOCTRACE_API_URL: "http://api:8000"
      DOCTRACE_API_KEY: "${DOCTRACE_API_KEY:-}"   # the dashboard needs no Qdrant credentials
    ports:
      - "127.0.0.1:8501:8501"
    volumes:
      - ./data/processed:/srv/doctrace/data/processed:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  hf_cache:
